<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vismaz">
  <!-- Ledger page -->
  <rect x="14" y="10" width="72" height="80" rx="6" fill="#0E7C7B"/>
  <rect x="14" y="10" width="72" height="16" rx="6" fill="#095B5A"/>
  <rect x="14" y="20" width="72" height="6" fill="#095B5A"/>
  <!-- Ruled lines -->
  <g fill="#FFFFFF" opacity="0.35">
    <rect x="24" y="38" width="34" height="4" rx="2"/>
    <rect x="24" y="50" width="26" height="4" rx="2"/>
    <rect x="24" y="62" width="30" height="4" rx="2"/>
  </g>
  <!-- Balanced column: the two marks that make the entry add up -->
  <g fill="#F4C95D">
    <rect x="64" y="38" width="12" height="4" rx="2"/>
    <rect x="64" y="50" width="12" height="4" rx="2"/>
  </g>
  <!-- Rule and total -->
  <rect x="24" y="72" width="52" height="2" fill="#FFFFFF" opacity="0.55"/>
  <rect x="60" y="78" width="16" height="5" rx="2.5" fill="#F4C95D"/>
</svg>
